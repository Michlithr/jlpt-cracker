# docker-compose.yaml
version: '3.8'

services:
  backend:
    build: ./backend
    container_name: jlpt-cracker-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/jlpt_cracker:/app/jlpt_cracker
      - ./backend/main.py:/app/main.py 
      - ./backend/pyproject.toml:/app/pyproject.toml
      - ./backend/poetry.lock:/app/poetry.lock
    command: /app/.venv/bin/uvicorn jlpt_cracker.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    depends_on:
      - db
      
  db:
    image: postgres:16-alpine
    container_name: jlpt-cracker-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data 
volumes:
  db_data: