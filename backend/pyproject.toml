[tool.poetry]
name = "jlpt_cracker"
version = "0.1.0"
description = "A FastAPI application for a JLPT study tool."
authors = ["Michał Litwa <michlithr@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.11" 
fastapi = {extras = ["standard"], version = "^0.115.6"}
uvicorn = {extras = ["standard"], version = "^0.30.1"}
sqlmodel = "^0.0.18"
sqlalchemy = "^2.0.31"
asyncpg = "^0.29.0"
alembic = "^1.13.1"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.6"
pytest-cov = "^5.0.0"
ruff = "^0.5.0"
mypy = "^1.10.1"
rich = "^13.7.1"

[tool.poetry.scripts]
jlpt-cracker = "jlpt_cracker.main:main"
start = "uvicorn jlpt_cracker.main:app --reload"

[tool.ruff]
line-length = 88
exclude = [".git", ".tox", ".nox", ".venv", "venv", "__pycache__", "dist"]

[tool.mypy]
files = "jlpt_cracker/**/*.py"
disallow_untyped_calls = true
disallow_untyped_defs = true